<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="navbar(activo)" class="sticky-top">
    <nav class="navbar navbar-expand-lg" aria-label="Navegación del cliente">
        <div class="container py-1">

            <a class="navbar-brand d-flex align-items-center" th:href="@{/cliente/menu}">
                <img th:src="@{/img/logo.png}" src="/img/logo.png"
                     alt="Logo MAGISTRAL" class="logo-magistral">
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menuCliente"
                    aria-controls="menuCliente" aria-expanded="false"
                    aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuCliente">
                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${activo == 'menu'} ? 'active'"
                           th:href="@{/cliente/menu}">
                            <i class="bi bi-egg-fried me-1"></i> Menú
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${activo == 'pedidos'} ? 'active'"
                           th:href="@{/cliente/pedidos}">
                            <i class="bi bi-receipt me-1"></i> Mis pedidos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${activo == 'reservas'} ? 'active'"
                           th:href="@{/cliente/reservas}">
                            <i class="bi bi-calendar-event me-1"></i> Reservas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">
                            <i class="bi bi-box-arrow-right me-1"></i> Salir
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
</header>

</body>
</html>
