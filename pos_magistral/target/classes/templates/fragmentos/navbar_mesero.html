<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="navbar(activo)" class="sticky-top">
    <nav class="navbar navbar-expand-lg" aria-label="Navegación del mesero">
        <div class="container py-1">

            <a class="navbar-brand d-flex align-items-center" th:href="@{/mesero/mesas}">
                <img th:src="@{/img/logo.png}" src="/img/logo.png"
                     alt="Logo MAGISTRAL" class="logo-magistral">
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menuMesero"
                    aria-controls="menuMesero" aria-expanded="false"
                    aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuMesero">
                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${activo == 'mesas'} ? 'active'"
                           th:href="@{/mesero/mesas}">
                            <i class="bi bi-grid-3x3-gap-fill me-1"></i> Mesas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${activo == 'pedidos'} ? 'active'"
                           th:href="@{/mesero/pedidos}">
                            <i class="bi bi-receipt me-1"></i> Pedidos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">
                            <i class="bi bi-box-arrow-right me-1"></i> Salir
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
</header>

</body>
</html>
