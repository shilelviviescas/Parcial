<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${titulo})}"></head>

<body>

<style>
    .comanda {
        max-width: 420px;
        margin: 0 auto;
        padding: 1.8rem;
        border: 2px solid #000000;
        background: #FFFFFF;
    }

    .comanda-titulo {
        text-align: center;
        padding-bottom: 1rem;
        margin-bottom: 1rem;
        border-bottom: 2px dashed #000000;
    }

    .comanda-titulo span {
        font-size: .72rem;
        font-weight: 900;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: #555555;
    }

    .comanda-titulo h2 {
        margin: .2rem 0 0;
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: -.04em;
    }

    .comanda-mesa {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        margin-bottom: 1.2rem;
        border: 2px solid #000000;
        background: #000000;
        color: #FFFFFF;
    }

    .comanda-mesa .etiqueta {
        font-size: .7rem;
        font-weight: 900;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: #D0D0D0;
    }

    .comanda-mesa .grande {
        font-family: var(--titulo);
        font-size: 3rem;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -.05em;
    }

    .comanda-mesa .hora {
        font-family: var(--titulo);
        font-size: 1.8rem;
        font-weight: 900;
        line-height: 1;
    }

    .comanda-orden {
        display: flex;
        justify-content: space-between;
        padding-bottom: .8rem;
        margin-bottom: .4rem;
        border-bottom: 1px solid #000000;
        font-size: .9rem;
    }

    .comanda-item {
        display: flex;
        align-items: baseline;
        gap: .9rem;
        padding: .8rem 0;
        border-bottom: 1px dotted #888888;
    }

    .comanda-item .cantidad {
        min-width: 3rem;
        font-family: var(--titulo);
        font-size: 1.9rem;
        font-weight: 900;
        line-height: 1;
    }

    .comanda-item .nombre {
        font-size: 1.15rem;
        font-weight: 800;
        line-height: 1.3;
    }

    .comanda-vacia {
        padding: 1.5rem 0;
        text-align: center;
        color: #555555;
        font-weight: 600;
    }

    @media print {
        header, .no-print { display: none !important; }
        body { background: #FFFFFF !important; }
        .section { padding: 0 !important; }
        .comanda { border: none; max-width: 100%; padding: 0; }
        .comanda-mesa {
            background: #FFFFFF !important;
            color: #000000 !important;
            border: 2px solid #000000;
        }
        .comanda-mesa .etiqueta { color: #000000; }
    }
</style>

<header th:replace="~{fragmentos/navbar_cajero :: navbar('pedidos')}"></header>

<main class="section">
    <div class="container">

        <!-- ==================== COMANDA PARA COCINA ==================== -->
        <article class="comanda">

            <div class="comanda-titulo">
                <span>Comanda de cocina</span>
                <h2>MAGISTRAL</h2>
            </div>

            <div class="comanda-mesa">
                <div>
					<div>
					    <div class="etiqueta" th:text="${pedido.domicilio ? 'Tipo' : 'Mesa'}">Mesa</div>
					    <div class="grande" th:style="${pedido.domicilio} ? 'font-size: 1.6rem;'"
					         th:text="${pedido.domicilio ? 'DOMICILIO' : pedido.numeroMesa}">1</div>
					</div>
                <div class="text-end">
                    <div class="etiqueta">Hora de entrada</div>
                    <div class="hora" th:text="${#temporals.format(pedido.fecha, 'HH:mm')}">12:00</div>
                </div>
            </div>

            <div class="comanda-orden">
                <span>Orden</span>
                <strong th:text="${pedido.numeroOrden > 0 ? '#' + pedido.numeroOrden : '-'}">#1</strong>
            </div>

            <div class="comanda-item" th:each="item : ${items}">
                <span class="cantidad" th:text="${item.cantidad} + '×'">1×</span>
                <span class="nombre" th:text="${item.nombre}">Producto</span>
            </div>

            <p class="comanda-vacia" th:if="${#lists.isEmpty(items)}">
                Este pedido no tiene productos para preparar.
            </p>

        </article>

        <!-- ==================== ACCIONES (no se imprimen) ==================== -->
        <div class="d-flex flex-wrap justify-content-center gap-2 mt-4 no-print">
            <button type="button" class="btn-m" onclick="window.print()">
                <i class="bi bi-printer"></i> Imprimir comanda
            </button>

            <a class="btn-m-outline" th:href="@{/cajero/pedidos}">
                <i class="bi bi-arrow-left"></i> Volver a los pedidos
            </a>
        </div>

    </div>
</main>

<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>

</body>
</html>
